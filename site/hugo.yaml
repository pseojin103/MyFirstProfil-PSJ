baseURL: "https://github.com/pseojin103/MyFirstProfil-PSJ.git"
languageCode: "ko-kr"
title: "MyProfile-PSJ"


# 단일 한국어 메뉴 설정
Menus:
  main: []

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "MyProfile"
  description: "개인 포트폴리오 사이트"
  favicon: "/favic.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  # If you want to customize the menu, you can change it here
  navbar:
    align: mx-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "My Profile - PSJ" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "안녕하세요"
    title: "박서진입니다."
    subtitle: "관심 분야: 인공지능"
    content: "안녕하세요, 전북대 컴퓨터인공지능학부 2학년 재학중인 박서진이라고 합니다. 
              제 관심분야는 인공지능입니다. 
              인공지능을 선택한 이유는 수학적인 기반 아래 레이어들을 쌓아가며 다양한 분야에 적용하는 것에 매력을 느껴 선택하게 되었습니다."
    image: /images/itsme.jpg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Resume"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/pseojin103

  # About
  about:
    enable: true
    title: "학습목표"
    content: |-
      향후 학습 목표는 
      인공지능 분야의 전공 지식 쌓기입니다. 수학적인 지식, 코딩 실력, 컴퓨터 시스템 등
      다양한 분야의 지식이 필요합니다.
    skills:
      enable: true
      title: "아래는 이를 위한 구체적인 계획입니다:"
      items:
        - "파이썬 공부하기"
        - "확률과 통계, 선형대수학, 미적분과 같은 수학적인 기반 지식"
        - "인공지능 아키텍쳐 공부하기"

  # Experience
  experience:
    enable: true
    title: "대표 활동"
    items:
      - company: "대표 활동 1"
        companyUrl: "#projects"
        jobs:
          - name: "Hugo를 이용한 개인 포트폴리오 사이트 만들기"
            date: "26-10 ~ 26-11-05. 완료"
            content: "활동 목적 : 학교 과제입니다. 하지만 과제에만 그치지 않고
                      웹사이트를 만들면서 발생하는 여러 변수 상황들을 경험하고 해결해나가며 성장하는 것을 목표로 하며 수행하려고 했습니다."
            info:
              content: 대표활동을 누르면 결과물로 이동합니다.
          - name: "역할 : 개인 수행과제였기 때문에 공동 작업은 없었습니다."
            content: "수행 과정 : Hugo Themes를 통해 기본 테마를 선택한 뒤
                      실제 사이트를 만들면서 모르는 내용은 AI를 활용해 채워나갔습니다. 사용한 AI는 제미나이였습니다. 
                      일회성이 아닌 언제든지 확장할 수 있는 구조를 만들려했습니다.

                      도구 선택 이유: LLM만을 사용하여 이해하며 넘어가고 싶어서 제미나이를 선택했습니다.
                      "
       
  # Education
  education:
    enable: true
    title: "역량 및 적용 사례"
    index: false
    items:
      - title: "ecilpse를 활용한 JAVA 코딩"
        school:
          name: "JAVA 문법을 바탕으로한 객체지향 코드를 작성할 수 있다."
        content: |-
          역량 적용 사례: 마인크래프트(minecraft)의 초기 버전이 자바로 작성되었습니다. 멀티스레딩 기능을 지원하기에 복잡한 게임에서 유용합니다.
        image: "/images/minecraftPhoto.jpg"

  # Achievements
  achievements:
    enable: false

  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Hugo를 이용한 자기소개 웹사이트 만들기
        content: 앞으로 저만의 포트폴리오들을 추가할 예정입니다.
        image: /images/projects/projects1.png
        featured:
          name: 데모
          link: https://pseojin103.github.io/MyFirstProfil-PSJ/
        badges:
          - "Hugo"
          - "My Profile"
        links:
          - icon: fab fa-github
            url: https://github.com/pseojin103

  #Contact
  contact:
    enable: true
    title: "연락처"
    content: 궁금한 점이 있으시거나 함께 이야기 나누고 싶으시다면 언제든 연락주세요!
    btnName: 이메일 보내기
    btnLink: mailto:seojinbag103@gmail.com

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: false
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/pseojin103
      instagram: https://instagram.com/s.zin4

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: false
    readTime:
      enable: true
      content: "분 소요"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "더보기"
    toc: "목차"
    copyright: "All rights reserved"
    emailText: "이 사이트를 공유합니다."

  datesFormat:
    article: "2006년 1월 2일"
    articleList: "2006년 1월 2일"
    articleRecent: "2006년 1월 2일"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
  #  <script type="text/javascript"><!-- any script here --></script>
